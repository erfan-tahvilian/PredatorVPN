name: Bootstrap node refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and filter SOCKS5 nodes
        env:
          SUB_URL: https://config.blackpredator.dpdns.org/sub/fvRkIJUpaza9bok2hLUIuzd6wabSgOyBDKl5gr195GUHXzWFO0cafiV3
        run: |
          set -euo pipefail
          mkdir -p docs/bootstrap
          BODY=$(curl -fsSL --max-time 45 "$SUB_URL" || true)
          if [ -z "$BODY" ]; then
            echo "Empty subscription" >&2
            exit 0
          fi
          if printf '%s' "$BODY" | grep -qE '^[A-Za-z0-9+/=[:space:]]+$' && ! printf '%s' "$BODY" | grep -q '://'; then
            DECODED=$(printf '%s' "$BODY" | base64 -d 2>/dev/null || true)
            [ -n "$DECODED" ] && BODY="$DECODED"
          fi
          {
            echo "# auto-refreshed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf '%s\n' "$BODY" | tr -d '\r' | grep -E '^(socks5?|SOCKS5?)://' | head -n 40 || true
          } > docs/bootstrap/working-nodes.txt
          wc -l docs/bootstrap/working-nodes.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bootstrap/working-nodes.txt
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(bootstrap): refresh SOCKS5 node list"
            git push
          fi

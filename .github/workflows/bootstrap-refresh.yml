name: Bootstrap node refresh

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch subscription and write full node list
        env:
          SUB_URL: https://config.blackpredator.dpdns.org/sub/fvRkIJUpaza9bok2hLUIuzd6wabSgOyBDKl5gr195GUHXzWFO0cafiV3
        run: |
          set -euo pipefail
          mkdir -p docs/bootstrap
          BODY=$(curl -fsSL --max-time 60 -A 'PredatorVPN-Bootstrap/1.1' "$SUB_URL" || true)
          if [ -z "$BODY" ]; then
            echo "Empty subscription body from $SUB_URL" >&2
            exit 0
          fi
          # Decode base64 payloads (common for clash/v2ray subs)
          if printf '%s' "$BODY" | tr -d '\r\n\t ' | grep -qE '^[A-Za-z0-9+/=]+$' && ! printf '%s' "$BODY" | grep -q '://'; then
            DECODED=$(printf '%s' "$BODY" | tr -d '\r\n\t ' | base64 -d 2>/dev/null || true)
            if [ -n "$DECODED" ]; then
              BODY="$DECODED"
            fi
          fi
          {
            echo "# auto-refreshed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# source: $SUB_URL"
            printf '%s\n' "$BODY" | tr -d '\r' | sed '/^[[:space:]]*$/d' | sed '/^#/d' | grep -E '^(vless|vmess|trojan|ss|ssr|socks5?|hy2|hysteria2?|tuic)://' | head -n 200 || true
          } > docs/bootstrap/working-nodes.txt
          echo "lines=$(wc -l < docs/bootstrap/working-nodes.txt)"
          echo "sample:"
          head -n 5 docs/bootstrap/working-nodes.txt

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bootstrap/working-nodes.txt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(bootstrap): refresh node list from subscription"
          # Avoid race with concurrent pushes on main
          git pull --rebase origin main
          git push origin main

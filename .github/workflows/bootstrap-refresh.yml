name: Bootstrap node refresh

on:
  schedule:
    # Hourly at :17 UTC; avoids GitHub Actions' high-load top-of-hour window.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predator-bootstrap-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh Raw list from private subscription
        env:
          BOOTSTRAP_SUB_URL: ${{ secrets.PREDATOR_BOOTSTRAP_SUB_URL }}
        run: |
          set -euo pipefail
          if [ -z "$BOOTSTRAP_SUB_URL" ]; then
            echo "GitHub Actions secret PREDATOR_BOOTSTRAP_SUB_URL is missing." >&2
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = os.environ['BOOTSTRAP_SUB_URL']
          request = Request(url, headers={'User-Agent': 'PredatorVPN-Bootstrap-Refresh/2'})
          with urlopen(request, timeout=50) as response:
              payload = response.read(1024 * 1024 + 1)
          if len(payload) > 1024 * 1024:
              raise SystemExit('Subscription too large; refusing to overwrite working nodes')
          text = payload.decode('utf-8-sig').strip()
          if '://' not in text:
              try:
                  text = base64.b64decode(''.join(text.split()), validate=True).decode('utf-8-sig')
              except Exception as exc:
                  raise SystemExit('Invalid subscription format; preserving working nodes') from exc
          protocols = ('vless://', 'vmess://', 'trojan://', 'ss://', 'socks://', 'socks5://')
          nodes = []
          seen = set()
          for raw_line in text.splitlines():
              line = raw_line.strip()
              if line.lower().startswith(protocols) and line not in seen:
                  nodes.append(line)
                  seen.add(line)
          if not nodes:
              raise SystemExit('Subscription returned no supported nodes; preserving working nodes')
          if len(nodes) > 200:
              nodes = nodes[:200]
          destination = Path('docs/bootstrap/working-nodes.txt')
          destination.parent.mkdir(parents=True, exist_ok=True)
          updated = '# PredatorVPN Bootstrap nodes (automatically refreshed)\n' + '\n'.join(nodes) + '\n'
          if destination.exists() and destination.read_text(encoding='utf-8') == updated:
              print(f'No changes; {len(nodes)} nodes')
          else:
              destination.write_text(updated, encoding='utf-8')
              print(f'Updated Raw list: {len(nodes)} nodes')
          PY

      - name: Commit updated node list if changed
        run: |
          set -euo pipefail
          # Attribute automated subscription updates to the repository owner.
          # GITHUB_TOKEN still authenticates the push; the commit message identifies automation.
          git config user.name "erfan-tahvilian"
          git config user.email "198095948+erfan-tahvilian@users.noreply.github.com"
          git add docs/bootstrap/working-nodes.txt
          if git diff --cached --quiet; then
            echo "Node list unchanged"
            exit 0
          fi
          git commit -m "chore(bootstrap): synchronize node subscription"
          git pull --rebase origin main
          git push origin main
